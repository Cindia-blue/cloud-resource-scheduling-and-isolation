apiVersion: v1
kind: ServiceAccount
metadata:
  name: ioi-scheduler
  namespace: kube-system
---
# Scoped to scheduling only; distinct from any default-scheduler RBAC.
# Does not grant permission to modify kube-system or the default
# scheduler.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ioi-scheduler-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/binding"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ioi-scheduler-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ioi-scheduler-role
subjects:
  - kind: ServiceAccount
    name: ioi-scheduler
    namespace: kube-system
