apiVersion: v1
kind: ConfigMap
metadata:
  name: ioi-scheduler-config
  namespace: kube-system
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    # Distinct scheduler identity: only Pods that opt in via
    # spec.schedulerName: ioi-scheduler are ever scheduled by this
    # instance. The default scheduler and every other Pod in the
    # cluster is untouched.
    profiles:
      - schedulerName: ioi-scheduler
        plugins:
          multiPoint:
            disabled:
              - name: "*"
            enabled:
              - name: PrioritySort
              - name: TaintToleration
              - name: NodeAffinity
              - name: NodeResourcesFit
              - name: DefaultBinder
    leaderElection:
      leaderElect: false
