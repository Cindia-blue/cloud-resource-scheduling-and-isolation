# Distinct, adapter-specific identity. Deliberately not reused across
# other components: all cgroup mutation happens via a privileged
# hostPath mount on the node itself, never via Kubernetes API
# permissions. This RBAC only lets the adapter read the Pods/Nodes it
# needs to discover the application-to-cgroup mapping.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iocost-adapter
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iocost-adapter-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iocost-adapter-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: iocost-adapter-role
subjects:
  - kind: ServiceAccount
    name: iocost-adapter
    namespace: kube-system
