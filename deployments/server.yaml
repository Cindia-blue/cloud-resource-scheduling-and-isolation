apiVersion: v1
kind: Pod
metadata:
  name: iperf3-server
  namespace: ioi-system
  labels:
    app: iperf3-server
spec:
  containers:
    - name: iperf3
      image: networkstatic/iperf3
      command: ["iperf3", "-s"]
      ports:
        - containerPort: 5201
---
apiVersion: v1
kind: Service
metadata:
  name: iperf3-server
  namespace: ioi-system
spec:
  selector:
    app: iperf3-server
  ports:
    - port: 5201
      targetPort: 5201
